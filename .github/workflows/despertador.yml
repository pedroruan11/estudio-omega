# "Despertador" manual: acessa a rota /saude (não consulta o banco) para acordar o app no Render.
# O agendamento automático foi removido em 06/11/2026: o cron do GitHub (plano gratuito) não disparava.
# Quem mantém o app acordado agora é o cron-job.org (ver README).
# Para rodar na mão: Actions → Despertador → Run workflow.
name: Despertador

on:
  workflow_dispatch:

jobs:
  acordar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Acessar /saude
        run: curl -fsS --max-time 90 --retry 2 https://estudio-omega.onrender.com/saude
