{% extends "estudio/base.html" %}
{% block titulo %}Trocar senha{% endblock %}
{% block topo %}
<header class="topo compacto"><a class="voltar" href="{% url 'mais' %}" aria-label="Voltar"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></a><h1>Trocar senha</h1></header>
{% endblock %}
{% block conteudo %}
<form method="post" style="display:flex;flex-direction:column;flex:1">{% csrf_token %}
<main class="conteudo" style="gap:16px">
{% if form.errors %}<div class="erro" role="alert">{% for f in form %}{% for e in f.errors %}{{ e }}<br>{% endfor %}{% endfor %}</div>{% endif %}
<label class="campo">Senha atual<input type="password" name="old_password" autocomplete="current-password" required></label>
<label class="campo">Nova senha<input type="password" name="new_password1" autocomplete="new-password" required><small>Mínimo de 8 caracteres.</small></label>
<label class="campo">Repita a nova senha<input type="password" name="new_password2" autocomplete="new-password" required></label>
<button class="btn ouro" type="submit" style="min-height:54px">SALVAR NOVA SENHA</button>
</main>
</form>
{% endblock %}
